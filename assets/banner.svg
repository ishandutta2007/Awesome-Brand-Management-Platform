<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card / Element Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f472b6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Subtle Dynamic Animations in Background Elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashWorkflow {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 8; animation: dashWorkflow 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Background Orbs (Behind content) -->
  <circle cx="150" cy="80" r="180" fill="#8b5cf6" opacity="0.25" filter="url(#glow)" class="pulse-orb" />
  <circle cx="1050" cy="260" r="220" fill="#ec4899" opacity="0.2" filter="url(#glow)" class="pulse-orb" />

  <!-- DYNAMIC BACKGROUND GRAPHICS (Pills, Flow Nodes, Cards - strictly behind text layer) -->
  <g stroke="#ffffff" stroke-opacity="0.15" fill="none" class="flow-line">
    <path d="M 750 80 Q 900 130 1050 90" stroke="#8b5cf6" stroke-width="2" />
    <path d="M 800 260 Q 950 200 1100 240" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Background Dynamic UI Card 1 (Right Side) -->
  <g class="floating-card-1" transform="translate(820, 50)" filter="url(#shadow)">
    <rect width="300" height="100" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#8b5cf6" opacity="0.8" />
    <rect x="75" y="25" width="140" height="12" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="75" y="47" width="90" height="10" rx="5" fill="#94a3b8" opacity="0.7" />
    <rect x="230" y="25" width="50" height="22" rx="11" fill="#10b981" opacity="0.8" />
    <circle cx="255" cy="72" r="12" fill="#ec4899" opacity="0.6" />
    <circle cx="230" cy="72" r="12" fill="#3b82f6" opacity="0.6" />
  </g>

  <!-- Background Dynamic UI Card 2 (Right Side Lower) -->
  <g class="floating-card-2" transform="translate(760, 180)" filter="url(#shadow)">
    <rect width="360" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <rect x="25" y="25" width="60" height="60" rx="10" fill="url(#accentGrad)" opacity="0.85" />
    <rect x="100" y="30" width="160" height="14" rx="7" fill="#ffffff" opacity="0.95" />
    <rect x="100" y="54" width="110" height="10" rx="5" fill="#cbd5e1" opacity="0.7" />
    <rect x="100" y="72" width="180" height="8" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="280" y="30" width="60" height="26" rx="6" fill="#6366f1" opacity="0.9" />
  </g>

  <!-- Dynamic Glowing Accent Bar -->
  <rect x="80" y="55" width="160" height="6" rx="3" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- FOREGROUND CONTENT LAYER (Guaranteed clear visibility & non-overlapping) -->
  <text x="80" y="45" class="tag">CURATED ECOSYSTEM REPOSITORY</text>

  <!-- Main Title -->
  <text x="80" y="125" class="title" filter="url(#shadow)">
    Awesome Brand Management
  </text>
  <text x="80" y="180" class="title" fill="url(#accentGrad)">
    Platform Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="80" y="225" class="subtitle">
    Digital Asset Management (DAM), Brand Guidelines &amp; Creative Workflows
  </text>

  <!-- Foreground Feature Pills -->
  <g transform="translate(80, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="80" y="22" text-anchor="middle" class="badge-text">💎 Enterprise DAM</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="265" y="22" text-anchor="middle" class="badge-text">⚡ Open-Source Stack</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="455" y="22" text-anchor="middle" class="badge-text">🎨 Creative Proofing</text>
  </g>
</svg>
